name: Deploy to Firebase Hosting (production)
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create environment file
        run: |
          cat > .env <<'EOF'
          NG_APP_API_KEY=${{ vars.NG_APP_API_KEY }}
          NG_APP_AUTH_DOMAIN=${{ vars.NG_APP_AUTH_DOMAIN }}
          NG_APP_PROJECT_ID=${{ vars.NG_APP_PROJECT_ID }}
          NG_APP_STORAGE_BUCKET=${{ vars.NG_APP_STORAGE_BUCKET }}
          NG_APP_MESSAGING_SENDER_ID=${{ vars.NG_APP_MESSAGING_SENDER_ID }}
          NG_APP_APP_ID=${{ vars.NG_APP_APP_ID }}
          NG_APP_MEASUREMENT_ID=${{ vars.NG_APP_MEASUREMENT_ID }}
          NG_APP_RECAPTCHA_ENTERPRISE_SITE_KEY=${{ vars.NG_APP_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          NG_APP_GEOAPIFY_API_KEY=${{ secrets.NG_APP_GEOAPIFY_API_KEY }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLOCKEDIN_PROD }}
          channelId: live
          projectId: clockedin-prod
