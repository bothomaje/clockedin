<section class="clk-auth-card">
  <header class="clk-auth-card__header">
    <h2>Log in</h2>
    <p>Pick up where you left off with your job search.</p>
  </header>

  @if (errorMessage()) {
    <section class="clk-banner clk-banner--error" role="alert">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="m10.29 3.86-8.18 14.14A2 2 0 0 0 3.82 21h16.36a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
        />
        <path d="M12 9v4M12 17h.01" />
      </svg>
      <section>
        <p class="clk-banner__title">Unable to log in</p>
        <p class="clk-banner__text">{{ errorMessage() }}</p>
      </section>
    </section>
  }

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="clk-auth-card__form">
    <section class="clk-auth-card__fields">
      <section class="clk-field">
        <label class="form-label" for="email">Email Address</label>
        <input
          id="email"
          type="email"
          class="form-control"
          name="email"
          autocomplete="email"
          [(ngModel)]="email"
          required
        />
      </section>

      <section class="clk-field">
        <label class="form-label" for="password">Password</label>
        <section class="clk-input-icon">
          <input
            id="password"
            type="password"
            class="form-control"
            name="password"
            autocomplete="current-password"
            [class.is-invalid]="credentialError()"
            [(ngModel)]="password"
            required
          />
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </section>
        @if (credentialError()) {
          <p class="clk-field__error">
            Check your email and password. Passwords are case-sensitive.
          </p>
        }
      </section>

      <section class="clk-auth-card__options">
        <a routerLink="/forgot-password">Forgot password?</a>
      </section>
    </section>

    <section class="clk-auth-card__actions">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="isSubmitting() || loginForm.invalid"
      >
        {{ isSubmitting() ? 'Logging in...' : 'Log in' }}
      </button>
      <p class="clk-auth-card__redirect">
        <span>New to clockedin?</span>
        <a routerLink="/signup">Create account</a>
      </p>
    </section>
  </form>
</section>
