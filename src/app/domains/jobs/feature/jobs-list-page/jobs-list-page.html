<app-page-header title="Saved Opportunities" eyebrow="Jobs" [compact]="true">
  <a actions routerLink="/jobs/new" class="btn btn-primary d-inline-flex align-items-center gap-2">
    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M12 5v14M5 12h14" />
    </svg>
    Save a job
  </a>
</app-page-header>

<app-job-list
  variant="saved"
  noun="job"
  defaultSort="savedAt"
  errorTitle="We couldn't load your saved jobs."
  emptyTitle="No saved jobs yet"
  emptyDescription="Saving opportunities helps you track salaries, key contacts, and tailor your portfolio case studies for each pipeline."
  (view)="onView($event)"
  (edit)="onEdit($event)"
>
  <a routerLink="/jobs/new" class="btn btn-primary">Save a job</a>
</app-job-list>
