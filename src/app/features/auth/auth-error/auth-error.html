<section class="clk-auth-card">
  <header class="clk-auth-card__header">
    <h2>Log in</h2>
    <p>Please verify your details and resume monitoring active applications.</p>
  </header>

  <section class="clk-banner clk-banner--error" role="alert">
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path
        d="m10.29 3.86-8.18 14.14A2 2 0 0 0 3.82 21h16.36a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
      />
      <path d="M12 9v4M12 17h.01" />
    </svg>
    <section>
      <p class="clk-banner__title">Sign-in problem</p>
      <p class="clk-banner__text">{{ message }}</p>
    </section>
  </section>

  <section class="clk-auth-card__actions">
    <a routerLink="/login" class="btn btn-primary">Back to log in</a>
    <p class="clk-auth-card__redirect">
      <span>New to clocked?</span>
      <a routerLink="/signup">Create account</a>
    </p>
  </section>
</section>
