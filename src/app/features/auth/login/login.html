<main class="container mt-5">
  <h2 class="mb-4">Sign In</h2>

  @if (errorMessage()) {
    <p class="alert alert-danger">{{ errorMessage() }}</p>
  }

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <section>
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" [(ngModel)]="email" required />
    </section>
    <section class="mt-2">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" [(ngModel)]="password" required />
      <p class="mt-2">Forgot password? <a routerLink="/forgot-password">Reset</a></p>
    </section>

    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting() || loginForm.invalid">
      {{ isSubmitting() ? 'Signing In...' : 'Sign In' }}
    </button>
  </form>

  <p class="mt-3 text-center">Don't have an account? <a routerLink="/signup">Sign Up</a></p>
</main>
