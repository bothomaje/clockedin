@if (document().structured) {
  <button
    class="btn btn-outline-secondary btn-sm"
    [disabled]="isDownloading()"
    (click)="download()"
  >
    {{ isDownloading() ? 'Building PDF...' : 'Download PDF' }}
  </button>
}
@if (downloadError()) {
  <p class="text-danger mt-2">{{ downloadError() }}</p>
}
