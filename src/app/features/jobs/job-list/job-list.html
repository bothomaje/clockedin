<table class="table table-striped mt-3">
  <thead class="table-dark">
    <tr>
      <th>Company</th>
      <th>Role</th>
      <th>Status</th>
      <th>Updated At</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (job of jobs(); track job.id) {
      <tr app-job-card [job]="job" (view)="view.emit($event)" (edit)="edit.emit($event)"></tr>
    } @empty {
      <p class="mt-3">No jobs being tracked currently</p>
    }
  </tbody>
</table>
