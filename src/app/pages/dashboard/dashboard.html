<main class="container mt-4">
  <h2>Dashboard</h2>
  <table class="table table-striped mt-3">
    <thead class="table-dark">
      <tr>
        <th>Company</th>
        <th>Role</th>
        <th>Status</th>
        <th>Applied Date</th>
      </tr>
    </thead>
    <tbody>
      @for (job of jobs; track job.id) {
        <tr>
          <td>{{ job.company }}</td>
          <td>{{ job.role }}</td>
          <td><span class="badge bg-secondary">{{ job.status }}</span></td>
          <td>{{ job.appliedDate }}</td>
        </tr>
      }
    </tbody>
  </table>
</main>
