<main class="container mt-5">
  <h2 class="mb-4">Reset Password</h2>

  @if (message) {
    <p class="alert alert-success">{{ message }}</p>
  }
  @if (errorMessage) {
    <p class="alert alert-danger">{{ errorMessage }}</p>
  }

  <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
    <section>
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" [(ngModel)]="email" required />
    </section>
    <button type="submit" class="btn btn-primary mt-3" [disabled]="isSubmitting || resetForm.invalid">
      {{ isSubmitting ? 'Sending...' : 'Send Reset Link' }}
    </button>
  </form>

  <p class="mt-3 text-center"><a routerLink="/login">Back to Sign In</a></p>
</main>
