@if (toastService.toast(); as toast) {
  <section
    class="clk-toast"
    [class.clk-toast--error]="toast.kind === 'error'"
    [attr.role]="toast.kind === 'error' ? 'alert' : 'status'"
  >
    <section class="clk-toast__message">
      <span class="clk-toast__icon">
        <svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          @if (toast.kind === 'error') {
            <path d="M12 6v8M12 18h.01" />
          } @else {
            <path d="m5 12 5 5L20 7" />
          }
        </svg>
      </span>
      <p>{{ toast.message }}</p>
    </section>
    <section class="clk-toast__actions">
      @if (toast.action; as action) {
        <a [routerLink]="action.link" (click)="toastService.dismiss()">{{ action.label }}</a>
      }
      <button type="button" aria-label="Dismiss" (click)="toastService.dismiss()">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </section>
  </section>
}
