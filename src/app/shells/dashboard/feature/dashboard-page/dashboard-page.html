<app-page-header eyebrow="Dashboard" [title]="headline()">
  <a
    actions
    routerLink="/applications/new"
    class="btn btn-primary d-inline-flex align-items-center gap-2"
  >
    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M12 5v14M5 12h14" />
    </svg>
    Add application
  </a>
</app-page-header>

<section class="clk-dashboard">
  @if (!profile.loading() && !profile.onboardingComplete()) {
    <p class="alert alert-info">
      Finish setting up your profile — <a routerLink="/onboarding">resume onboarding</a>.
    </p>
  }

  <app-application-stats-widget />

  <section class="clk-dashboard__grid">
    <section class="clk-dashboard__main">
      <app-active-applications-widget />
      <app-top-matches-widget />
      <app-follow-ups-widget />
    </section>

    <aside class="clk-dashboard__side">
      <app-todo-list-widget />
      <app-job-search-goals-widget />
    </aside>
  </section>
</section>
